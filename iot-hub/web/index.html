<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IoT Hub</title>
  <meta name="theme-color" content="#2a78d6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IoT Hub">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <h1>IoT Hub</h1>
    <select id="tenant" hidden aria-label="Tenant" title="Tenant"></select>
    <span class="alerts" id="alerts" role="status" hidden></span>
    <span class="conn" id="conn" data-state="idle">Connecting…</span>
    <button id="install" hidden title="Install the dashboard as an app">Install</button>
    <button id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
    <button id="edit">Edit</button>
    <a id="settings" class="button" href="admin.html" hidden>Settings</a>
    <button id="logout" hidden>Sign out</button>
    <button id="add" class="primary" hidden>Add tile</button>
    <button id="save" class="primary" hidden>Save layout</button>
  </header>
  <main id="grid"></main>

  <dialog id="login">
    <form id="login-form">
      <h3>Sign in</h3>
      <p class="sub">This hub requires an access token. Ask an administrator for a viewer token.</p>
      <label for="login-token">Access token</label>
      <input id="login-token" type="password" autocomplete="current-password" required>
      <p id="login-err" class="sub" role="alert"></p>
      <div class="actions"><button class="primary">Sign in</button></div>
    </form>
  </dialog>

  <dialog id="dlg">
    <form method="dialog" id="form">
      <h3>Add tile</h3>
      <label for="f-type">Tile type</label>
      <select id="f-type" name="type"></select>
      <label for="f-sensor">Sensor</label>
      <select id="f-sensor" name="sensor"></select>
      <label for="f-field">Field</label>
      <select id="f-field" name="field"></select>
      <label for="f-title">Title (optional)</label>
      <input id="f-title" name="title" maxlength="80">
      <div class="row2">
        <div><label for="f-w">Width</label><select id="f-w" name="w"><option value="1">1</option><option value="2">2</option></select></div>
        <div><label for="f-h">Height</label><select id="f-h" name="h"><option value="1">1</option><option value="2">2</option></select></div>
      </div>
      <div id="f-opts"></div>
      <div class="actions">
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="ok" class="primary">Add</button>
      </div>
    </form>
  </dialog>
</body>
</html>
